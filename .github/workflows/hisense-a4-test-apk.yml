name: Hisense A4 - Test Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hisense-a4-test-apk.yml"
      - "launcher/**"

# Cloud build only. Never connects to the TV or alters installed software.
permissions:
  contents: read

jobs:
  build-test-apk:
    name: Build Android 9-compatible test APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build the APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain testReleaseUnitTest lintRelease assembleRelease

      - name: Record SHA-256 and check APK size
        run: |
          set -euo pipefail
          cd launcher/app/build/outputs/apk/release
          test -s app-release.apk
          sha256sum app-release.apk > app-release.apk.sha256
          ls -lh app-release.apk
          cat app-release.apk.sha256

      - name: Upload downloadable test APK
        uses: actions/upload-artifact@v4
        with:
          name: Hisense-A4-Launcher-Test-${{ github.run_number }}
          path: |
            launcher/app/build/outputs/apk/release/app-release.apk
            launcher/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
